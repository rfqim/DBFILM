<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Rating Film TMDB</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: #1e1b4b;
            --badge-text: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-section {
            background: var(--card-bg);
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .search-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .search-box-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.8;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .btn-search {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-search:hover {
            background-color: var(--accent-hover);
        }

        .btn-search:active {
            transform: scale(0.98);
        }

        .hint-text {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Table Results Styling */
        .results-container {
            margin-top: 30px;
            width: 100%;
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 5px;
        }

        .results-count {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .table-wrapper {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #111827;
            color: #cbd5e1;
            padding: 14px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(59, 130, 246, 0.05);
        }

        .score-badge {
            display: inline-block;
            min-width: 32px;
            padding: 4px 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .no-result {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }
    </style>
</head>

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsTableBody = document.getElementById('resultsTableBody');
        const resultsCount = document.getElementById('resultsCount');

        // Allow pressing Enter to search
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            
            if (!query) {
                resultsContainer.style.display = 'none';
                return;
            }

            // Extraksi angka dari query jika user mengetik format rating "5, 1, 1" atau "5 1 1"
            const numbers = query.match(/\d+/g);
            let matchedMovies = [];

            if (numbers && numbers.length === 3) {
                const [aksiVal, komediVal, dramaVal] = numbers.map(Number);
                matchedMovies = filmData.filter(movie => 
                    movie.aksi === aksiVal && 
                    movie.komedi === komediVal && 
                    movie.drama === dramaVal
                );
            } else {
                // Pencarian berdasarkan Judul Film
                matchedMovies = filmData.filter(movie => 
                    movie.title.toLowerCase().includes(query)
                );
            }

            renderResults(matchedMovies, query);
        }

        function renderResults(movies, query) {
            resultsTableBody.innerHTML = '';
            resultsContainer.style.display = 'block';

            if (movies.length === 0) {
                resultsCount.textContent = `Tidak ada hasil untuk "${query}"`;
                resultsTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-result">
                            Tidak ada film yang cocok dengan pencarian Anda.
                        </td>
                    </tr>
                `;
                return;
            }

            resultsCount.textContent = `Ditemukan ${movies.length} film untuk "${query}"`;

            // Tampilkan maksimal 100 hasil agar performa tetap cepat
            const displayLimit = 100;
            const displayMovies = movies.slice(0, displayLimit);

            displayMovies.forEach(movie => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 500;">${escapeHtml(movie.title)}</td>
                    <td style="text-align: center;"><span class="score-badge">${movie.aksi}</span></td>
                    <td style="text-align: center;"><span class="score-badge">${movie.komedi}</span></td>
                    <td style="text-align: center;"><span class="score-badge">${movie.drama}</span></td>
                `;
                resultsTableBody.appendChild(tr);
            });

            if (movies.length > displayLimit) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td colspan="4" style="text-align: center; color: #94a3b8; padding: 10px;">
                        ...dan ${movies.length - displayLimit} hasil lainnya.
                    </td>
                `;
                resultsTableBody.appendChild(tr);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
